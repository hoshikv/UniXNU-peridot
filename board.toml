schema_version = 2

# Board description of the Xiaomi Poco F6 / Redmi Turbo 3 (peridot, SM8635), read by the unixnu build driver.
# Schema 2 uses the iPhone 13 (D17AP) iOS 27.0.1 profile for the kernel/ADT
# source while the hardware device tree remains peridot.

[board]
name = "peridot"
soc = "SM8635"
description = "Xiaomi Poco F6 / Redmi Turbo 3"
kit = "peridot"
soc_source = "sm8550"
os_profile = "ios-27.0.1-24A446"

# Adreno 735 (SM8635, Cliffs): the GPU block is gen7_11_0 with the shared
# A7XX GMU, so the uke A732 gen71100 kit applies. These values come from the
# peridot DTB; no GPU memory pool is reserved yet, so the driver allocates its
# context from the kernel VM until the ADT/UEFI pool is added.
[gpu]
model = "Adreno735"
chip_id = "0x43030b00"
compatible = "qcom,adreno-gpu-gen7-11-0"
family = "ADRENO_7XX_GEN2"
gpu_base = "0x3d00000"
gpu_size = "0x40000"
gmu_base = "0x3d68000"
gmu_size = "0x37000"
gmu_pdc_base = "0xb280000"
gmu_pdc_size = "0x10000"
gpucc_base = "0x3d90000"
gpucc_size = "0xa000"
gcc_base = "0x100000"
smmu_base = "0x3da0000"
smmu_size = "0x40000"
sid_user = 0x00
sid_secure = 0x02
sid_gmu = 0x05
gmem_bytes = "0x180000"
gmu_chip_id = "0x70b0000"
gmu_cgc_mode = "0x00020202"
preempt_record_bytes = "0x225000"
ubwc_version = 4
ubwc_swizzle = 3
highest_bank_bit = 16
num_pwrlevels = 13
initial_pwrlevel = 10
min_pwrlevel = 12
max_pwrlevel = 0
firmware_sqe = ["gen71100_sqe.fw"]
firmware_gmu = ["gen71100_gmu.bin"]
firmware_zap = ["gen71100_zap.mbn"]
firmware_source = "/vendor/firmware + /odm/firmware"

[gpu.firmware_pins."gen71100_sqe.fw"]
bytes = 66036
sha256 = "b6df660d109504dbea5a266910b037a33d893a11c6de52f524a5fd112008c401"

[gpu.firmware_pins."gen71100_gmu.bin"]
bytes = 80680
sha256 = "435c7bac9a328b8a100df930b84b65b4d579e42be44785d0e60e3729291bb864"

[gpu.firmware_pins."gen71100_zap.mbn"]
bytes = 12088
sha256 = "1294992888e8c7c7fcd8a6d0a672cc666eff3c95e666ce5840db7e03edcc500d"

[kernel]
defconfig = "peridot_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-libpthread-kernel.py",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py SoftwareAES",
  "build-software-aes-bindings.py",
  "build-gop-legacy-display.py",
  "build-sheng-source-storage.py --policy-dir scripts/policies/ios-27.0.1-24A446",
  "build-peridot-touch.py",
  "build-fileset-release-reference.py --tree .",
]
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "GopFramebuffer", "QcomGeniSpi", "AppleKeyStoreState", "XnuPrelink", "DarwinBoot", "VerifiedRoot", "AirNir", "ShengUfs", "RamBlock"]

[device_tree]
source = "device:dts/peridot.dts"
include_dirs = ["soc:dts"]

[adt.product]
[adt.product.string]
model = "xiaomi,peridot"
artwork-display-gamut = "sRGB"
[adt.product.u32]
thin-bezel = 1
[adt.defaults]
[adt.defaults.u32]
sleep-disabled = 1
[adt.buttons]
[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"
[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]
[adt.buttons.u32]
home-button-type = 2

[firmware]
config = "peridot"
dsc = "Platforms/Xiaomi/peridotPkg/peridot.dsc"
fd = "Build/peridotPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/apply-peridot-firmware.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "peridot"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "peridot-unixnu"

[payload]
volume = "PERIDOTES"
size_mib = 64
root_policies = "{tree}/build/sheng-source-storage/root-policies.bin"
loader = "firmware"
title = "peridot first boot: UniXNU"
dram_size = "0x380000000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = false
trust_cache_sha256 = []
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-hid-home=1",
  "offline-hid-input=1",
  "offline-legacy-phase=4",
  "offline-mobile-graphics-client=1",
  "offline-mobile-graphics-load=1",
  "offline-apfs-load=1",
  "boot-progress=2",
  "-apfs_shared_datavolume",
  "offline-key-events=1",
  "peridot-touch=4",
  "native-source-storage=1",
  "native-ufs-probe=2",
]

[payload.adt]
chip_id = "0x8110"
owned_memory_size = "0x200000000"
packed_data_ramdisk = true
persistent_data = false

[bootimg.image]
os_version = "15.0.0"
os_patch_level = "2025-06"

[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0xe3940000", "0x0", "0x2b00000"] },
]
