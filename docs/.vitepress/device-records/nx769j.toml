[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["ARM64 Qualcomm DRAM base 0x80000000, confirmed on the device by gunyah_hyp_region@80000000 and the lowest System RAM range.", "Handoff window 0x80000000 bytes at 0x80000000, matching payload.dram_size.", "Measured contiguous-splash reservation at 0xe3940000 with size 0x2b00000, label cont_splash_region.", "Apps SMMU at 0x15000000/0x100000 and GPU SMMU at 0x03da0000/0x40000, both qcom,sm8650-smmu-500.", "UFS host and PHY register ranges shared with SM8550."]
configuration = ["device_tree.source = device:dts/nx769j.dts; include_dirs = [soc:dts].", "memory@80000000 declares one contiguous DRAM range; payload.adt.owned_memory_size and payload.dram_size are both 0x80000000.", "reserved-memory declares splash_region at 0xe3940000 with size 0x2b00000 and no-map, and board.toml re-adds the same node to the boot image tree."]
procedure = ["Compare firmware RAM ranges, reserved regions, DTS ranges and ADT memory-map entries.", "Check DMA buffers against controller address width, cache policy and SMMU mapping before submitting work.", "Record the measured reservations in device-inputs.md with the command that produced each value."]
findings = ["The memory node describes the contiguous DRAM range handed to XNU, not the installed RAM. This unit reports MemTotal 15705424 kB, about 15.0 GiB usable from a 16 GiB SKU, with System RAM ranges above 4 GiB at 0x880000000, 0x8b0000000, 0x8c0000000 and 0xa00000000. UniXNU takes one contiguous window from that map.", "The handoff window and payload.dram_size are still 2 GiB at 0x80000000, following sheng and caihong. UniXNU-nx729j, a RedMagic 8 Pro+ port built on the same code base, instead passes the full 16 GiB computed from the device ddr-regions 0x80000000/2G plus 0x880000000/6G plus 0xa00000000/8G, and this unit's measured System RAM shows the same three-region shape. The two parameters are independent, so they need deciding together against the firmware memory map before the first kernel boot rather than assumed from either port.", "The splash reservation is the one board value that only the device can give: node name splash_region, label cont_splash_region, reg 0xe3940000 with size 0x2b00000. The node name and label match UniXNU-sheng and the size also matches sheng and shennong, so only the address is board specific.", "Physical register translation and CPU virtual mappings have different purposes. Preserve physical resource ranges in hardware descriptions.", "The Apps SMMU and GPU SMMU register ranges are identical between SM8550 and SM8650, so the shared SMMU kit is applicable to this board.", "An exported register below 16 MiB is an error: the common generator reads the arm-io window base as the SoC base and requires it to be non-zero.", "The kernel memory node is split into System RAM ranges with reservations removed, not the raw DRAM extent. Do not copy it into the board DTS; the board declares the handoff window."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The removed regions listed by the firmware are not all enumerated here; only the splash reservation is consumed by the current configuration.", "The handoff window is a build policy value. Confirm it against the firmware memory map before a kernel boot."]
next_action = ["Compare the firmware memory map against the declared handoff window and the splash reservation at the first kernel boot.", "Record each remaining reserved region that a driver starts consuming."]

