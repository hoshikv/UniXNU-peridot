[[area]]
id = "storage"
status = "implemented"
components = ["ShengUfs", "VirtioMmioBlock", "VerifiedRoot"]
paths = ["drivers/ShengUfs", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*"]
inputs = ["UFS host 0x01d84000/0x3000 (qcom,sm8650-ufshc, jedec,ufs-2.0, SPI 265) and UFS PHY 0x01d80000/0x2000 (qcom,sm8650-qmp-ufs-phy).", "GCC AXI, AHB, UniPro, symbol and PHY auxiliary branches; power domains and firmware link state.", "Apps SMMU at 0x15000000, UFS stream assignment, context-bank ownership, DMA width and cache maintenance.", "NX769J is an A/B device with dynamic partitions; userdata is a f2fs volume at /dev/block/bootdevice/by-name/userdata and the super partition is 9126805504 bytes."]
configuration = ["Select ShengUfs, VirtioMmioBlock and VerifiedRoot; CONFIG_XNU_NATIVE_UFS=y and CONFIG_XNU_NATIVE_VIRTIO_BLOCK=y.", "dts/nx769j.dts sets &ufs and &ufsphy status = okay.", "board.toml [userdata] carries the measured extents: first_lba 3302184, last_lba 124002298, lba_bytes 4096, with OS and SystemOS windows."]
procedure = ["Read https://unixnu.com/porting/ufs with this storage record.", "Inspect clock enables, power state, HCE/HCS, link state, request-list base and SMMU mappings before changing controller ownership.", "Validate SCSI capacity and GPT reads, then publish the OS and SystemOS windows within the userdata range.", "Verify persistent Data writes on the documented Data allocation with a recovery image available."]
findings = ["UFS host and PHY addresses are identical between SM8550 and SM8650, and the compatible differs only in the SoC name (qcom,sm8550-ufshc versus qcom,sm8650-ufshc). The shared ShengUfs controller access applies to this board; the board owns its userdata policy. The device confirms both ranges in /proc/iomem.", "An idle AHB branch may report CLK_OFF with hardware gating enabled. Check enable and gating bits together.", "SMMU bypass still has address-width constraints. Validate every DMA range and context-bank assignment.", "recovery.fstab mounts /data as f2fs on userdata, so the persistent Data path must handle f2fs rather than the ext4 layout assumed by some board configurations.", "The measured GPT has userdata as the last occupied partition ending exactly on the last usable sector, with 32 table entries of which 12 are used. Those are the preconditions the dual-system partition tool requires, so a unixnu partition can be carved without altering any other entry.", "The device publishes five regular UFS LUNs plus the RPMB and boot well-known LUNs (49456, 49476, 49488).", "The public NX769J board configurations record BOARD_SUPER_PARTITION_SIZE := 9126805504 with a TODO saying the value is hardcoded. The measured super partition is 12.0 GiB; that guess is not the real size."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["payload.adt.root_match_volume_uuid is still REQUIRED_ROOT_VOLUME_UUID and must be read from the installed OS image.", "ShengUfs contains sheng Data and log policy that is board specific and is not reused here.", "The GPT extents are measured on one unit. Re-read them before writing, since a different SKU or a repartitioned device has different bounds."]
next_action = ["Read the OS window APFS volume UUID once the image is installed and set payload.adt.root_match_volume_uuid.", "Confirm the SCSI capacity reported by the controller matches the measured GPT before the first write."]

