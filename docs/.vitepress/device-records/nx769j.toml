inputs = ["Firmware log exporter and QR log export from https://unixnu.com/porting/log-capture#firmware-setup.", "Serial console over kernel argument serial=3.", "The NX769J device firmware revisions: baseband 5.0.c3-00030-LANAI_GEN_PACK-1.46586.20 and trustzone TZ.XF.5.0-07512.2-LANAIAAAAANAZT-1.46586.1."]
configuration = ["kernel_args are '-v serial=3'; payload.panic_screen = true and payload.timeout = 3.", "scripts/collect-device-inputs.sh gathers the board inputs that no public source provides."]
procedure = ["Read https://unixnu.com/porting/log-capture and https://unixnu.com/porting/bring-up.", "Set up QR log export during firmware integration and save the firmware log before the kernel handoff.", "Record each command, revision, output and result, and assign each area its completion level from https://unixnu.com/porting/records#completion-levels."]
findings = ["Each claimed milestone needs a reproducible command, a matching source and image revision, and an accessible result. Store large logs as linked release or CI artifacts.", "The firmware revisions identify a verification result on this device, so they belong in every device evidence entry once one exists.", "device-inputs.md records the board inputs measured over read-only adb, with the command behind each value. The handset reports a spoofed Xiaomi identity through its userspace properties while its boot image, kernel and device tree identify NX769J, so identity and hardware values were read from getprop of the bootimage properties, the kernel, the device tree and the raw UFS partition table rather than from the spoofed product properties.", "scripts/collect-device-inputs.sh is the same collection procedure in runnable form and remains the way to re-measure before writing to a device.", "The merged kernel configuration can carry either the CONFIG_XNU_ name from the defconfig syntax or the bare XNU_ name the kernel build consumes, and a false value can appear as n, 0 or '# NAME is not set'. scripts/check-merged-config.py accepts all of those forms so the check reports a real value mismatch instead of a format difference."]
completion = ["Each claimed milestone has a reproducible command, a matching source/image revision and an accessible result."]
limits = ["No port verification exists on the device yet: the measurements are hardware facts, not evidence that the port runs. All evidence stays source evidence until an image boots.", "Log capture and recovery commands are not set up because the firmware is not built."]
next_action = ["Set up QR log export in the uefi-nx769j firmware and capture the firmware log before the first kernel handoff.", "Re-run the device-inputs.md commands immediately before any write, since the recorded GPT extents describe one unit at one point in time."]

