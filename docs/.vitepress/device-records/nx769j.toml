[[area]]
id = "firmware"
status = "planned"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/extract-files.py", "scripts/gen-touch-firmware.py", "scripts/collect-device-inputs.sh", "scripts/check-nx769j-firmware.py", "firmware/**", "docs/UEFI-FIRMWARE.md", "scripts/extract-firmware-dtb.py", "scripts/extract-uefi-drivers.py"]
inputs = ["uefi-nx769j Mu-Silicium platform package for the Pineapple QRD base board.", "Stock firmware DTB carried in the device vendor_boot image.", "UEFI GOP handoff, PSCI SMC interface and the vendor firmware inventory from proprietary-files.txt.", "Android 14 ABL: boot header version 4, 4096-byte pages, kernel base 0x0."]
configuration = ["firmware.config = nx769j; firmware.dsc = Platforms/ZTE/nx769jPkg/nx769j.dsc; firmware.fd = Build/nx769jPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd. The vendor directory is ZTE, not Nubia: nubia is ZTE brand and the verified sibling package is Platforms/ZTE/nx729jPkg.", "firmware.preflight = [scripts/check-nx769j-firmware.py], which checks the Mu-Silicium layout, that Resources/Configs/nx769j.toml agrees with board.toml, that the DSC includes the SM8650 SoC package and that the vendor DXE drivers are present.", "firmware.submodules = [Common/Mu, Common/Mu_OEM_Sample, Silicium-ACPI, Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl]; Mu_Basecore is the separate {edk2} checkout, not a submodule.", "firmware.patches = [Resources/MuPatches/Gic-Spurious.patch], applied to the shared edk2 tree for the build and reverted afterwards.", "firmware.packages = [{uefi}, {uefi}/Platforms/ZTE, {tree}/package, {tree}/drivers/DarwinBoot, {edk2}, {uefi}/Common/Mu, {uefi}/Common/Mu_OEM_Sample, {uefi}/Silicon/Qualcomm, {uefi}/Silicon/Silicium, {uefi}/Silicium-ACPI, {uefi}/Silicium-ACPI/Platforms/ZTE, {uefi}/Silicium-ACPI/Silicon/Qualcomm].", "firmware.defines.DEVICE_MODEL = nx769j.", "The platform DSC includes LanaiPkg/LanaiPkg.dsc.inc with SOC_TYPE = 2. LanaiPkg is Mu-Silicium SM8650 support and SOC_TYPE 2 is SM8650-AB, Snapdragon 8 Gen 3 at 3.30 GHz with 8 cores.", "[bootimg.image] base = 0x0, pagesize = 4096, header_version = 0. The ABL is a version 4 boot chain, and Resources/Configs/nx769j.toml records 4, but bootimg.py merges DEFAULTS, then the firmware config and then board.toml, so board.toml decides what is packed: bootimg.py verify() only reads v0/v1/v2 headers and a v4 image fails its round-trip check. Extending verify() for v4 is the fix if the ABL rejects the v0 image."]
procedure = ["Read https://unixnu.com/porting/uefi-firmware and create the uefi-nx769j platform package.", "Include UniXNU, UniXNUPkg, DarwinBoot and, for a Mu-Silicium initrd, UniXNURamDiskDxe, DiskIoDxe and FAT support in the DSC and FDF.", "Include the firmware log exporter from https://unixnu.com/porting/log-capture#firmware-setup so logs can be scanned from the menu during bring-up.", "Run ./unixnu build firmware -D ../UniXNU-NX769J --uefi ../uefi-nx769j and record the firmware commit, output FD and handoff memory map.", "Run ./unixnu bootimg with the firmware DTB and inspect the payload report."]
findings = ["Mu-Silicium names SoC packages by Qualcomm platform codename, not by part number. NX769J is Lanai: the device firmware reports baseband 5.0.c3-00030-LANAI_GEN_PACK and trustzone LANAIAAAAANAZT, and LanaiPkg.dsc.inc declares SM8650-AA through SM8650-AC together with the GIC bases 0x17100000 and 0x17180000 that this board measures. The KailuaPkg that nx729jPkg includes is SM8550 and is wrong for this board.", "UniXNU/uefi-sheng branch sheng already carries Platforms/ZTE/nx729jPkg, a complete platform package for a nubia RedMagic one SoC generation back whose boot.img reaches fastboot boot OKAY on hardware. Platforms/ZTE/nx769jPkg is the same derivation from the Pineapple QRD base board that nx729jPkg is, so the vendor directory is ZTE rather than Nubia.", "nx729j.toml sets boot_image.header_version = 4 where sheng and qrd8550 use 3 and 0, which confirms the NX769J ABL setting independently of the board configuration.", "The UniXNU boot chain modules are not a firmware-side gap: ./unixnu build package builds UniXNU.efi, UniXNUDxe.efi and UniXNURamDiskDxe.efi on Linux with CLANGPDB, which is what proves the DSC integration points this design specifies resolve. What the firmware step still needs is the vendor binary set.", "The firmware DTB is a separate input to boot-image assembly; XNU consumes the ADT generated from the board DTS.", "NX769J boots through UEFI: the board configuration sets TARGET_USES_UEFI := true and records BOARD_BOOTIMG_HEADER_VERSION := 4. What the ABL does with the version 0 image unixnu packs is unverified; the sibling RedMagic port packs the same v0 image and fastboot-boots it on hardware, which is the evidence that this is the right shape.", "The stock bootloader keeps a contiguous-splash region. It is measured at 0xe3940000 with size 0x2b00000 and label cont_splash_region, and board.toml re-adds it to the boot image's device tree through a [[bootimg.dtb_node]] entry, the way sheng declares /reserved-memory/splash_region.", "The device tree model stays the Qualcomm reference name on this board family. This unit reports 'Qualcomm Technologies, Inc. Pineapple MTP' with compatible qcom,pineapple-mtp and qcom,pineapple, and the NX769J stock DTB overlay in the public dump targets qcom,pineapple-qrd. The board DTS therefore names nubia,nx769j with the qcom,pineapple fallbacks."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Library/MemoryMapLib.c is nx729j's map with the identifiers renamed and is not this board's map. Three conflicts are known against sources that measured this board: HYP is 0x00A00000 where gunyah_hyp_region is 0x00E00000, Display Reserved is at 0xB8000000 where cont_splash_region is at 0xE3940000, and TZApps Reserved at 0xD8800000 overlaps this board's ramoops at 0xD7E00000. The firmware must not be booted until the map is rebuilt: a map that reserves the wrong ranges lets it write over what the bootloader or TrustZone owns.", "The map is not rebuilt by editing those three lines. nx729j's table is a hand-built hybrid -- the device tree's fine-grained reservations grouped into coarser descriptors, plus UEFI's own regions such as FD Reserved, UEFI Stack, SEC Heap, Sched Heap, FV Region and DXE Heap that the device tree knows nothing about. Moving Display Reserved alone would leave 0xB8000000..0xBAB00000 unaccounted, and the device tree reserves nothing there, trading a known wrong region for a silently unmanaged one.", "The vendor UEFI DXE drivers are laid out and the firmware builds. scripts/extract-uefi-drivers.py recovers all 52 that the platform includes name, from uefi.img, where they sit in gzip-compressed nested firmware volumes under an outer volume holding only SEC and a platform configuration. Twelve carry a UI name different from the INF name the DSC uses -- I2CDxe's module is called plain I2C -- and the script maps them rather than guessing by prefix. The expected set is read from APRIORI.inc, DXE.inc and RAW.inc rather than kept in step with them: APRIORI.inc names one module that DXE.inc has commented out. They cannot be redistributed, so every build machine runs the extraction.", "The Silicium-ACPI SoC tables are Kailua's, which is SM8550. Silicium-ACPI has no Lanai set, and APIC, GTDT and PPTT describe Kailua's cores where this board has two A520, five A720 and one X4. XNU reads the Apple device tree rather than ACPI, so this does not affect the XNU boot, but the tables are wrong for an ACPI operating system.", "SOC_TYPE is set to 2 from the board name and the 8-CPU topology. The device does not record the prime core maximum frequency, so 2 against 4 (3.30 against 3.40 GHz) is not measured."]
next_action = ["Rebuild nx769jPkg/Library/MemoryMapLib/MemoryMapLib.c from the 49 reservations in device-inputs.md#fw-dtb, grouping them and adding UEFI's own regions. Until then the firmware must not be booted.", "Record the 52 vendor module hashes in proprietary-files.txt. Then rebuild the memory map: MemoryMapLib.c is still nx729j's and must be rebuilt from the 49 reservations in device-inputs.md before the firmware is booted.", "Build a Lanai ACPI table set, or drop the tables from the DSC if XNU is the only target. Silicium-ACPI has none and the Kailua tables describe a different CPU topology.", "Run ./unixnu build firmware --uefi ../uefi-nx769j, which is unblocked once the vendor drivers are present and the map is rebuilt, and record the FD and its size.", "Then reach the UniXNU menu with a published 1116x2480x32 framebuffer."]
