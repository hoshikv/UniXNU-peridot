[[area]]
id = "packaging"
status = "device-verified"
components = ["XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "scripts/**", "docs/patches/**", "docs/bring-up.md"]
inputs = ["XNU built from source on a macOS runner against kernelcache f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7", "iPadOS 17.7.11 21H461 userland image", "64 MiB payload FAT image"]
configuration = ["header_version 2, pagesize 4096, kernel_offset 0x8000, tags_offset 0x100, dtb section from the live device tree", "payload as a raw FDF region at 0x00300000, published by KebabRamDisk over BlockIo", "kernel args -v keepsyms=1 kt_fixed_zones=120"]
procedure = ["./unixnu build payload, then wrap the FAT image in an MBR container, point the FDF FILE region at it, rebuild the firmware and run ./unixnu bootimg"]
findings = ["The payload cannot be an FFS file, and RamDiskDxe refused the buffer with EFI_INVALID_PARAMETER, so KebabRamDisk publishes the region as a BlockIo device with a device path for PartitionDxe.", "unixnu bootimg needs the patched mkbootimg call that passes the DTB for header version 2.", "The payload builder now injects the device tree nodes XNU looks up by property, and scripts/patch-func-ret.py replaces a single kernel function with a ret when one call has to be skipped without a kernel rebuild.", "The exported firmware patch keeps every edited firmware file, including the two kebab drivers and the BootShim, so the tree can be rebuilt from the patch alone."]
completion = ["The boot image loads, the menu appears and the kernel is entered."]
limits = ["The payload image must be rebuilt whenever the ADT node injection changes."]
next_action = ["Fold the ADT node injection into the payload step so the wrapper step disappears."]
