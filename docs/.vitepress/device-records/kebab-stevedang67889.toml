schema_version = 1

[device]
name = "kebab"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "OnePlus 8T (KB2000). Firmware, menu and payload volume work. The kernel runs the whole of kernel_bootstrap, starts the scheduler and its first thread, and with PE_init_iokit, initialize_screen, kperf_init_early, ml_wait_max_cpus and platform_stall_panic_or_spin skipped it stops after PE_init_iokit and before bsd_init. A 32-checkpoint flag log is implemented, but the DRAM flag page does not survive the reset; the pram mailbox is the next measurement."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "porting.toml", "proprietary-files.txt", "local.toml.example", "AGENTS.md", "README.md", "configs/**", "dts/**", "docs/**", ".github/**", ".gitmodules", ".gitignore", ".gitattributes"]
inputs = ["UniXNU format 2 device repository", "UniXNU-sm8250-common SoC feed pinned in feeds.toml", "iPad7,1 17.7.11 21H461 donor IPSW"]
configuration = ["board.toml schema_version = 2", "components include ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink and DarwinBoot", "kernel.prelink slide -0x1000000 against kernelcache f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7", "kernel archives add build-arm-driver.py ArmDTPlatform and ArmCpu"]
procedure = ["Clone UniXNU, UniXNU-kebab and UniXNU-sm8250-common as siblings", "Run ./unixnu fetch and ./unixnu defconfig kebab_defconfig", "./unixnu status --json reports the resolved pins"]
findings = ["The format 2 builder exports an arm-io child only for device tree nodes that carry a unixnu,adt-name property, so an untagged tree yields an empty arm-io and the kernel has no interrupt controller.", "The boot image has to use the phone own device tree; the tree shipped with Mu-Silicium lacks cont_splash_region@9c000000 and ABL then keeps the panel dark.", "Two inputs are not in any repository and must be captured per handset: the live device tree from /sys/firmware/fdt and the kernel built on a macOS runner. proprietary-files.txt names both with their hashes and consumers.", "Every change to a file an area owns has to update that area findings or evidence in the same commit; the catalog workflow fails otherwise and names the path.", "The device summary is what the generated page shows first, so it has to name the current stage rather than the first blocker found.", "The README status table names the current PE_init_iokit to bsd_init gap and links the 32-checkpoint capture in docs/log-capture.md."]
completion = ["Every source pin resolves and the selected components have records; unixnu status reports the intended overrides."]
limits = ["No device-side repository record was published before this file; the entries below are the first complete record."]
next_action = ["Keep the record current as firmware and kernel patches land."]
[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "Format 2 board description with the SM8250 SoC feed and the five components above."

[[area.evidence]]
kind = "source"
reference = "porting.toml"
result = "Thirteen areas with measured facts; python3 scripts/porting-record.py check --device ../UniXNU-kebab passes."

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["docs/bring-up.md", "docs/patches/**", "package/**"]
inputs = ["Mu-Silicium Platforms/OnePlus/kebabPkg", "Phone's own live device tree as the boot image DTB", "boot_a, 96 MiB, header v2 with 4096-byte pages"]
configuration = ["FD_BASE 0x9FC00000, FD_SIZE 0x4600000 (3 MiB firmware volume plus a raw payload region at 0x00300000)", "UFSDxe removed from DXE.inc; SEC disables the APSS watchdog at 0x17C10008", "ScmDxeLA and SdccDxe are included; TzDxeLA is commented out", "Framebuffer PCDs 1080x2400x32", "unixnu bootimg passes the live DTB; ABL refuses images without the splash region node"]
procedure = ["Build firmware with ./unixnu build firmware -D ../UniXNU-kebab --uefi <Mu-Silicium>", "./unixnu bootimg -D ../UniXNU-kebab --uefi <Mu-Silicium> --fd <SILICIUM_UEFI.fd> --dtb <live.dtb> --ramdisk none", "fastboot flash boot_a <image>; fastboot reboot"]
findings = ["ABL hands the framebuffer over only when the boot image carries the phone's own device tree; the tree shipped with Mu-Silicium has no cont_splash_region@9c000000 and the panel stays black.", "A payload file inside the firmware volume is impossible: the FFS size field is 24 bits, so the 64 MiB payload is a raw FDF region instead.", "FrameBufferSerialPortLib handled newline and carriage return but ignored form feed, so DarwinBoot's clear screen did nothing and the left half of every log line was cut off.", "The payload builder injects the nodes XNU looks up by property (gic with interrupt-controller master, a one-cell redistributor stride, virtual-timer-intid, a timer node, pram and the panic log size); without them the kernel stops before PE_init_platform returns.", "KebabBootLog reads the 32 checkpoint bytes at 0xB9000010, prints the set list and clears the flags; CacheMaintenanceLib flushes the clear.", "The current firmware has SCM and SDCC but no UFS block device: UFSDxe is removed for the vendor assert, TzDxeLA is disabled and SdccDxe does not replace UFS."]
completion = ["Firmware boots from boot_a, the menu is rendered on the panel, the keys navigate it and the log is readable."]
limits = ["USB is not brought up in the firmware; the only log transport is the panel."]
next_action = ["Publish a firmware image revision alongside each kernel change."]
[[area.evidence]]
kind = "device"
reference = "docs/bring-up.md"
command = "fastboot flash boot_a out/darwin-boot.img; fastboot reboot"
revision = "97f6fea12dae49a1bbc30ccd22c098b82b97dbe4"
result = "UniXNU menu on the KB2000 panel listing the payload entry, keys working, full firmware and DarwinBoot log readable."

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["dts/kebab.dts", "scripts/patch-func-ret.py", "scripts/patch-xnu-log-probe.py", "docs/bring-up.md", "docs/log-capture.md"]
inputs = ["Eight cores at MPIDR affinities 0x000 through 0x700", "PSCI method smc", "19.2 MHz timebase"]
configuration = ["cpus node with one cpu per affinity and state running/waiting", "timebase-frequency 0x124f800", "arm-io/gic interrupt-controller master, virtual-timer-intid 27"]
procedure = ["Install the kernel entry probe with entry_probe_reset_delay and a symbol to bisect", "Read the stage bars: blue is kernel entry with the MMU off, magenta is just before the MMU is on", "A reboot six seconds after the bars proves the probe point was reached", "Run scripts/patch-xnu-log-probe.py on a private kernel copy, build the payload and read the 32 flags in KebabBootLog"]
findings = ["The kernel is entered and enables the MMU once ExitBootServices is allowed to finish; the timed reset after the MMU enable proves it.", "With PE_create_console replaced by a ret, the kernel completes PE_init_printf, PE_init_cpu, machine_conf, vm_mem_bootstrap, console_init, sched_init and kernel_thread_create, and reaches the bootstrap thread with its first context switch.", "_machine_startup is four instructions and tail-branches into _kernel_bootstrap, so a probe placed after that call can never fire; earlier readings of it measured nothing.", "_arm_init calls PE_init_platform twice and kernel_startup_initialize_upto is called once per init stage, so a probe needs entry_probe_reset_occurrence when the call appears more than once.", "The kernel clears the screen when it creates the console, so a black panel after the stage bars does not mean the kernel died.", "The kernel removes its identity map in arm_vm_init and the physical aperture starts at gPhysBase. The ring is below both window configurations' kernel base, so the stub uses ml_phys_write_byte, which maps the unmanaged page through the uncached CPU copy window instead of phystokv.", "A call-site stub can save x0-x8 and LR, call ml_phys_write_byte, restore and tail-call the original callee, so arguments and return address are unchanged.", "The 32 calls between PE_init_iokit and the first bsd_init locks name the gap: the last set byte is the call entered, and the next unset byte is the callee that did not return.", "The 4 GiB window loads the kernel at physical 0x20007C000 (base A, measured by a temporary DarwinBoot colour band). A one-stub BSS write at 0x7B281B0, dc cvac and PSCI reset reboots, but the next reader still sees no prefix, so normal DRAM does not carry the flag across the reset; pram 0x17F00FE0 is the persistent page."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer and IPI handling works on each enabled CPU."]
limits = ["Only the boot CPU runs; secondary cores are not started and _machine_conf does not complete."]
next_action = ["Confirm the pram one-stub at 0x17F00FE0 (out/prammap-boot.img), then move the 32 checkpoint bytes from the ring to pram and read last/next in KebabBootLog."]
[[area.evidence]]
kind = "device"
reference = "docs/bring-up.md"
command = "flash the reset-probe image and observe the panel"
revision = "97f6fea12dae49a1bbc30ccd22c098b82b97dbe4"
result = "Reboot six seconds after the stage bars with the probe after the MMU enable; no reboot with the probe after _machine_conf, so the kernel reached _machine_startup and stopped inside it."

[[area.evidence]]
kind = "source"
reference = "scripts/patch-xnu-log-probe.py"
result = "Resolves 32 call sites, verifies every original bl, places 80-byte stubs in __TEXT_EXEC padding and checks each branch."

[[area]]
id = "memory"
status = "implemented"
components = ["ArmDTPlatform"]
paths = ["dts/kebab.dts", "scripts/patch-func-ret.py", "docs/bring-up.md"]
inputs = ["DRAM banks 0x80000000+0x39900000, 0xC0000000+0xC0000000 and 0x200000000+0x200000000", "DarwinBoot window request of 3 GiB"]
configuration = ["dram-base, dram-size and darwinboot-memory-size all 0xC0000000", "/memory node in dts/kebab.dts restricted to the 0xC0000000 window", "DarwinBoot skips conventional-memory runs below 0x40000000"]
procedure = ["Build the payload so the generated ADT carries the window, then boot and read the DarwinBoot log line with the kernel virtual and physical base"]
findings = ["The kernel first-fit allocated at 0x7D000 and faulted during relocation; loading above 0x40000000 moved it to DRAM.", "A 256 MiB window leaves too little room in arm_vm_init's early I/O page-table reservation for the 0x2300000-byte framebuffer region; only after the window became 3 GiB did the kernel reach the MMU enable and _machine_startup.", "The physical aperture starts at gPhysBase and maps upward, so the 0xB9000000 ring has no phystokv mapping. ml_phys_write_data falls back to the uncached CPU copy window for this unmanaged page, which is how the stage-1 stub writes it.", "The 4 GiB test window put the kernel physical base at 0x20007C000, measured by a temporary DarwinBoot colour band; the 3 GiB build's 0xC007C000 is not the current local base.", "Normal DRAM does not carry the checkpoint flags across the reset: the 0xB9000010 ring, 0xC0001000/0x200001000 and a real __DATA BSS page all lose the byte after a reboot. The pram page at 0x17F00FE0 is the reset-persistent page; UEFI must map it before it can read the flags."]
completion = ["All handoff regions are accounted for and each enabled DMA engine uses the documented cache policy."]
limits = ["Only 3 GiB of the 12 GiB is handed to the kernel; no DMA or SMMU work is done yet."]
next_action = ["Widen the window or describe all three banks once the platform expert completes."]
[[area.evidence]]
kind = "device"
reference = "docs/bring-up.md"
command = "flash the entry-probe image and read the DarwinBoot physical base line"
revision = "97f6fea12dae49a1bbc30ccd22c098b82b97dbe4"
result = "DarwinBoot reports the kernel at physical 0xC007C000 inside the 3 GiB window, and the kernel reaches the MMU enable."

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["docs/bring-up.md"]
inputs = ["UFS host 0x1D84000", "userdata first_lba 4748320, last_lba 61748338 at 4096-byte blocks"]
configuration = ["UFSDxe removed from the firmware because the vendor driver asserts; ConfigurationMapLib sets EnableUfsIOC = 1, which removes the assert but still yields no block device"]
procedure = ["Not started; the kernel has no storage driver yet"]
findings = ["The vendor UEFI UFS driver asserts in UFS.c and must stay out of the firmware image.", "With no block device, the firmware cannot expose the root volume and the kernel cannot mount anything.", "DXE.inc includes ScmDxeLA and SdccDxe, comments out UFSDxe and TzDxeLA. The phone has no SD slot, so SDCC does not replace UFS; the missing UFS block device is still what blocks userdata/root."]
completion = ["The root volume mounts read-only from the OS window and Data is persistent."]
limits = ["No storage driver in firmware or kernel; userdata geometry is recorded but unverified against this handset."]
next_action = ["Decide between a native UFS driver and a RAM root image for the first userspace milestone."]
evidence = []

