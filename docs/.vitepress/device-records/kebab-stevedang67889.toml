configuration = ["PcdFrameBufferWidth 1080, PcdFrameBufferHeight 2400, PcdFrameBufferColorDepth 32", "DarwinEnter paints the hand-off band from the GOP base and flushes it from the data cache"]
procedure = ["Read the DarwinBoot video line, then confirm the panel shows text at the expected coordinates"]
findings = ["The stride used while drawing a glyph row must remain (FB_WIDTH - FONT_WIDTH * FontScale) * FB_BPP; using a full scanline there shears every glyph.", "The framebuffer is a DSC command-mode panel; the firmware console renders correctly with the inherited GOP."]
completion = ["The kernel presents the boot logo and later the SpringBoard frame through the controller or GOP."]
limits = ["Only the firmware text console is verified; the kernel has no display driver, so kernel output is limited to the entry probe bands."]
next_action = ["Add a kernel-side framebuffer console or the native display driver once _machine_conf completes."]
