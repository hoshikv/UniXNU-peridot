[[area]]
id = "diagnostics"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["docs/bring-up.md", "docs/log-capture.md", "docs/patches/**"]
inputs = ["Panel as the only output", "kernel entry probe and timed reset from patch-xnu-entry-probe.py"]
configuration = ["DEBUG output routed to the framebuffer console", "entry_probe_reset_delay with entry_probe_reset_after and entry_probe_reset_in selects the bisect point"]
procedure = ["Build the payload with the probe, flash, boot and read the panel", "A reboot after the delay means the probe point was reached"]
findings = ["Stage bars mark kernel entry and the point just before the MMU is on; a timed reset is the only signal available once the kernel runs without a console.", "A probe registered after the exit-boot-services notifications proved those notifications never returned; skipping them made the hand-off complete.", "Probes can mislead: an inline-assembly probe hardcoded to an identity mapping crashes after arm_vm_init closes that mapping and looks like a kernel hang.", "A checkpoint ring at 0xB9000000 and a BSS probe were tried. A one-stub BSS write + dc cvac + PSCI reset reboots, but the next reader still reads no prefix, so normal DRAM does not carry the flag across the reset; the 0xB9000010, 0xC0001000 and 0x200001000 probes behaved the same way.", "pram 0x17F00FE0 is the panic-log page that survives the reset. UEFI leaves it unmapped; a reader that adds it to the GCD and sets it uncached with gDS->AddMemorySpace and gDS->SetMemorySpaceAttributes was built, together with a one-stub ml_phys_write_byte(0x17F00FE0,1) + reset image (out/prammap-boot.img).", "Do not clear the flag page from the firmware: pram may be read-only to UEFI and the kernel clears its own BSS. The prefix check must accept only the value 1, not any non-zero byte."]
completion = ["A failed boot leaves enough on the panel or over a transport to identify the failed stage."]
limits = ["No USB or storage log transport yet; the RAM ring did not survive the reset in the 2026-10-28 test; the pram reader mapping is the current work."]
next_action = ["Boot out/prammap-boot.img and read the pram one-stub: if it reports last=0, move the 32 checkpoint bytes to pram."]
