paths = ["package/*Battery*", "package/*Battmgr*", "package/*Power*", "package/*PlatformPower*", "package/QcomQmp*", "package/QcomRpmh*", "package/QcomScm.h", "package/*Sdhci*", "scripts/*power*", "scripts/*battery*", "scripts/*pmgr*", "scripts/*firmware*", "scripts/*sdhci*"]
