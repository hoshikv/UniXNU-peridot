configuration = ["CONFIG_XNU_SHENG_PMGR=y; board.toml archives append build-platform-power.py; device series applies patches/xnu/sheng-platform-power.patch; package/ShengPlatformPower.cpp and scripts/build-platform-power.py are adapted with credit from TB128FU a9c3863."]
procedure = ["Run the bridge audit against the original kernelcache and prelinked kernel, then boot with sheng-pmgr=2 and no AMFI bypass for the first bounded test."]
findings = ["TB128FU's ShengPlatformPower bridge publishes the original ApplePMGRNub through an ABI-audited provider, reads and writes no hardware, and fails unsupported power operations explicitly.", "The audit passes against our original kernelcache f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7 and prelinked kernel. The PMGR-linked kernel sha256 is dc8184da757b5323d2f4fb6c7ac1d588790b3d44d583c6d6fd24897cdbbcfe60; bsd_init.o has XNU_SHENG_PMGR=1 and the kernel contains ShengPlatformPower and sheng_pmgr_run.", "QEMU TCG with sheng-pmgr=2 and no AMFI bypass reaches _bsd_init, _sheng_pmgr_run and _IOKitBSDInit with no AMFI 'No PMGR' panic and no _panic checkpoint; it stalls at _ml_get_timebase before _vfs_mountroot. Publication was not read back independently.", "The live FDT resolves /soc/sdhci@4744000 vdd-supply to phandle 0x1f7 (/soc/qcom,rpm-smd/rpm-regulator-ldoa24/regulator-l24, pm6125_l24) and vdd-io-supply to 0x1f0 (/soc/qcom,rpm-smd/rpm-regulator-ldoa11/regulator-l11, pm6125_l11). It reports L24 2,704,000-3,600,000 uV with init 2,704,000, L11 1,704,000-1,952,000 uV with init 1,704,000, SDHCI vdd level 2,960,000 uV, vdd-io level 1,800,000 uV, and qcom,vdd-io-always-on/lpm-sup booleans. No XNU RPM/RPMh/SPMI/regulator component exists; ShengPlatformPower is the Apple PMGR bridge, not a Qualcomm regulator driver. There is no supported XNU path to enable or set L24/L11, so the first host-local SDHCI probe keeps bus power and card clock off and reports the power stage blocked.", "The Mu-Silicium SDCC DXE ExitBootServices handler at SdccDxe.efi 0x81a8 configures the SDC1/SDC2 TLMM pads (0x00575000/0x00973000), sets SDHCI bus power, runs the v5 reset/power handshake (0x240/0x248/0x24c) and writes vendor registers; the reset clears the standard power and clock registers and the handler does not re-enable bus power, but has no PMIC/SPMI/LDO/RPM-request path. PmicDxeLa.efi 0x4220 locates the PMIC protocol GUID cea4489f-da0d-43d9-a3b2-766977a109f7 and calls the interface entry at 0x41ec, which issues SPMI writes at register bytes 0x14, 0x16 and 0xd1 only. Those addresses cannot reach the PM6125 LDO control registers 0x40/0x41/0x45/0x46/0x48/0x4c/0x61, so the two traced callees cannot directly write the L11/L24 enable or voltage registers. That is a direct-address exclusion, not proof that the callback leaves the rails unchanged: the 0x28 entry performs a read/modify/write of the arbiter IRQ clear register (v5 interpretation) over bitmap-selected APIDs (instruction sequence resolved; runtime bitmap unresolved), and for peripherals with the PMIC interrupt layout 0x14/0x16 are QPNPINT_REG_LATCHED_CLR and QPNPINT_REG_EN_CLR, so the writes clear latched interrupts and mask interrupt delivery. The 0xd1 value is u16>>14, so it can be 0-3, not necessarily zero. uefiplat.cfg has no LDO entries. During initialization the same IRQ status/clear routine runs via 0x266c -> 0x2d90, and 0x2d90 then calls 0x2ec8 with w3=0, which clears access-enable bit 0 for entries that pass its checks. The recovery path (0x27bc -> 0x3904) writes arbiter owner/APID registers at base+apid*4+0xa700 and base+apid*4+0x40900 when its conditions permit, though it is not proven to have run during the recorded boot. A null configuration pointer in the 0x120a8 exit callee reaches a non-returning self-loop, so the callback can hang instead of returning an error. See docs/firmware-handoff.md.", "qcom_spmi-regulator.c carries a PM6125 regulator table giving L11 peripheral 0x4a and L24 peripheral 0x57, with the common layout VOLTAGE_RANGE 0x40, VOLTAGE_SET 0x41, MODE 0x45 and ENABLE 0x46, so L11 enable is address 0x4a46 and L24 enable is 0x5746. The board DTS uses qcom,rpm-pm6125-regulators rather than qcom,pm6125-regulators, so the proven path is RPM-owned regulation, not AP-side SPMI access. Three limits keep this from being a ready probe: the vendor live.dts bounds the LDO USID to 0 or 1 but has no regulator subnode, so no pinned source chooses between them; voltage encoding is ops-dependent, with ldo/smps on the range/selector getter and ftsmps426/hfs430/hfsmps on the two-byte millivolt getter, and both getters return a software selector rather than microvolts; and pmic_arb_read_cmd issues the command with writel_relaxed into the observer window, where the 1000 us bound covers only the transaction poll, not the APID mapping walks. The audit in docs/pmic-audit.md blocks the probe: identity, the runtime callback state and the board-level electrical contract are all unresolved.", "docs/linux-regulator-lifecycle.md reconstructs the pinned board's power path with each statement tagged source-established, conditional or unknown. Only the board file has a regulators node; sdhc_1 has no vmmc-supply or vqmmc-supply; L11/L24 have DT min/max and regulator-allow-set-load but no regulator-boot-on, no regulator-always-on and no consumer, and their vdd_l9_l11/vdd_l23_l24 parent supply has no matching regulator, so regulator_resolve_supply may substitute the dummy regulator under full constraints, but registration does not depend on that substitution. Registration sets apply_uV and calls set_voltage, but rpm_reg_write_active includes uv only when the cached is_enabled is set, so no RPM packet is sent; always_on/boot_on are false, so registration does not enable either rail; the 30 s regulator_late_cleanup then reads the cached is_enabled of 0 and skips the disable. mmc_regulator_get_supply keeps -ENODEV error pointers, sdhci_msm_set_regulator_caps therefore writes no core_vendor_spec pad switch, sdhci_msm_set_pincfg calls pinctrl which returns 0 without applying a state, and the power IRQ acknowledges CORE_PWRCTL_BUS_SUCCESS after set_vmmc/set_vqmmc return 0. The probe does reset core_vendor_spec to 0xa9c and later paths rewrite other bits of it. Linux attempts RPM votes for VDDCX corners and interconnect bandwidth through rpmpd, OPP and icc-rpm, but none for L11/L24; a failed OPP call at probe is only warned about. The AP therefore never learns the rail state.", "Host-only dependency tracing corrects the sdhc_1 prerequisite record: the probe requests VDDCX SVS_PLUS and the genpd attach enters the rpmpd send path, but genpd aggregates across attached devices and subdomains and the provider caches that aggregate, which may be higher than SVS_PLUS, and a pre-sync aggregate may emit max_state and physical voltage is unmeasured; PIO does not use the SDHC DMA master; SMMU stream 0xc0 state is unknown; the TLMM SDC2 write target is 0x00973000; and the L11/L24 handoff state remains unmeasured. Pinned-revision MMC/SDHCI/genpd/ICC sources establish the power-request chain through sdhci_set_power_noreg, genpd power-on at attach, and that both SDHC interconnect paths attempt RPM master/slave and bus-clock votes (the cpu-sdhc path is not local-only). PIO uses CPU MMIO rather than the SDHC DMA master. Physical rail/CX voltage and SMMU state remain unmeasured. The power stage stays blocked.", "Step 4 records the candidate-specific electrical-contract assessment in docs/sdhc-electrical-contract.md. For sdhc-bus-power-activation every safety-critical area is blocking: supply voltage/absmax, IO compatibility, current/loading, transients, sequencing, back-powering, retention, fault handling and recovery. The document also records the evidence-acquisition requirements and proposed measurement requirements without executing them; PMIC readback is explicitly not a substitute for physical voltage or power-good evidence.", "Step 5 verifies only the existing controller-local probe: 33 deterministic scenarios pass, ten negative-control mutations are rejected by the simulator, and the separate-implementation oracle (same author) validates all 33 traces, rejects the same ten mutations plus forty-one synthetic trace controls, and accepts the valid initially-zero interrupt baseline. The oracle derives its policy from the header and write contract, not the harness allowlists. The policy still prohibits bus-power enable, card-clock enable, power-status acknowledgement and PMIC/RPM/SPMI activity.", "Step 6 records the dated NO-GO decision in docs/sdhc-decision-memo.md. The gate table fails electrical contract, starting state, access policy, software behavior for the bus-power-only candidate, independent assessment, recovery and authorization. Blockers use canonical E1-E9 (electrical-contract areas) and S1-S4 (software, provenance, independent assessment, authorization) identifiers. No approval request is made because the technical prerequisites are not met.", "The supplied dmaccess stock-firmware analysis archive was audited in docs/stock-firmware-analysis-audit.md. All 214 manifest-listed files match their hashes, but the supplied XBL executable bytes and device-tree overlays differ from the captured image and live FDT, so its code-level conclusions do not transfer automatically. Its XBL program-header layout prompted correction of our missing 0x5fc00000 LOAD range; its LCDB voltage, PMIC interrupt-specifier, XBL address and disassembly-coverage claims were corrected. It adds no rail, pad or power measurement and closes no gate."]
completion = ["Declared power controls and battery readings match observations; each claimed sleep/resume transition restores its dependent peripherals."]
limits = ["No power backend (clocks, sleep, reset) is implemented. The bridge is runtime-unqualified and the QEMU stall is unresolved. The RAM-root fixture booted through the PMGR-linked kernel without AMFI bypass arguments; PMGR publication and power operations remain unqualified.", "The firmware trace shows the Mu-Silicium PMIC exit path reaches only the SPMI write and the 0x28 entry and writes register bytes 0x14, 0x16 and 0xd1, which cannot directly reach the LDO control registers 0x40/0x41/0x45/0x46/0x48/0x4c/0x61; it does not measure the rails, does not resolve the runtime 0x28 bitmap or the clear-register read-back, and can clear latched PMIC interrupts and mask interrupt delivery on peripherals using the QPNPINT layout. The SPMI map reports commanded state only, supplies no power-good bit, leaves the LDO USID unresolved, and depends on a subtype read for voltage decoding. An SPMI read is a transport bring-up: it needs arbiter version detection, an APID owner-table parse and one observer command write per transaction, and the 1000 us bound covers only the transaction poll. The board-level electrical contract, including absolute maximums, consumer topology and safe sequencing, is not established, so docs/pmic-audit.md blocks live PMIC access."]
next_action = ["Capture a separate PMGR publication/power result on the tablet; do not claim power support from the bridge or from the RAM-root fixture. Keep bus power and the SDHCI card clock off until the retained-rail electrical contract and a direct rail measurement are established; a new RPM/SPMI/regulator path is not required merely to match the pinned design. See docs/sdhci-host-init.md. The Mu-Silicium exit trace is recorded in docs/firmware-handoff.md and does not unblock the power stage. Live PMIC/SPMI access is blocked by docs/pmic-audit.md: the L11/L24 slave assignment is unresolved between USID 0 and 1 (bounded to that pair and not selected by any pinned source in docs/pm6125-usid-research.md), the runtime 0x28 bitmap, the clear-register read-back value and the indirect callback paths remain unresolved, the voltage getters return software selectors rather than microvolts, and the board-level electrical contract is absent. Do not scan candidate slaves or substitute a USID. The next legitimate step is host-side: try to reconstruct the working RPM-owned Linux path and its assumptions from pinned sources rather than inventing AP-side SPMI access. That reconstruction is recorded in docs/linux-regulator-lifecycle.md and shows the AP never enables, disables or reads L11/L24. Remaining host-side questions are what the RPM firmware does across suspend and shutdown, whether the handoff rail state is guaranteed or incidental, which other consumers share the two supplies, and what the board-level electrical contract requires. docs/power-path-decision.md inventories that contract gap and selects the retained-rail RPM-owned path over AP-side SPMI; it does not authorize a live test. docs/sdhc-dependency-trace.md records the corrected remaining prerequisites and lists the fetched pinned-revision sources with hashes; passing the controller-local gate does not establish power, card-command, DMA or tuning readiness. Step 4 records the candidate-specific contract assessment in docs/sdhc-electrical-contract.md and Step 6 records NO-GO in docs/sdhc-decision-memo.md. The passing host-local scenarios, mutations and oracle are software evidence only; they do not authorize bus-power or card-clock activation. The next legitimate work is host-only evidence acquisition and, separately, an owner-approved measurement-only procedure that does not activate SDHC; approval of that measurement does not approve a controlled activation or the bus-power capability (docs/sdhc-decision-memo.md §6.2-§6.4). The current-tree evidence baseline is in docs/evidence-baseline.md. The dmaccess-supplied stock-firmware analysis and its audit are recorded in docs/stock-firmware-analysis-audit.md; they are cross-check material and do not authorize live access."]
evidence = [{ kind = "source", reference = "docs/rpm-power-interface.md", result = "Records the RPM-owned regulator path, why the AP never enables, disables or reads L11/L24, and the bounded captured-image trace of the RPM LDOA resource tables." }, { kind = "source", reference = "docs/power-retention-evidence.md", result = "Records the transition-by-transition retention gaps and the bounded RPM/XBL static trace: LDOA tables for both rails, no traced L11/L24 voltage/mode/enable write, and no retention result." }, { kind = "source", reference = "docs/stock-firmware-analysis-audit.md", result = "Audits the dmaccess-supplied stock-firmware analysis: 214/214 manifest hashes match, but the supplied XBL executable bytes and DT overlays differ from the captured image and live FDT; records the useful XBL layout lead, the corrected LCDB voltage/IRQ/XBL-address/disassembly-coverage claims, the RPM listing build mismatch and the absence of any rail or power measurement." }, { kind = "source", reference = "docs/pmic-audit.md", result = "Records the PMIC/SPMI audit corrections and the live-access blockers." }, { kind = "source", reference = "docs/pm6125-identity-evidence.md", result = "Inventories the pinned PM6125 identity, rail numbering and vendor consumer assignment; the USID and electrical contract remain unresolved." }, { kind = "source", reference = "docs/spmi-0x28-analysis.md", result = "Records the instruction-level SPMIDxe +0x28 trace, the access-type direct-address exclusion, the initialization access-enable clear, the recovery arbiter owner/APID writes, and the non-returning exit-callback configuration path." }, { kind = "source", reference = "docs/pm6125-register-map.md", result = "Records the L11/L24 SPMI base addresses, common offsets and voltage-decoding caveats." }, { kind = "source", reference = "docs/firmware-handoff.md", result = "Records the Mu-Silicium exit trace and the booted-image provenance for the three drivers." }, { kind = "source", reference = "docs/evidence-baseline.md", result = "Records the current-tree revision, dirty/untracked inventory, relevant file hashes, pinned-source cache provenance and the distinction between the current tree, the local firmware volume and the previously booted image." }, { kind = "source", reference = "docs/sdhci-host-init.md", result = "Records the host-init probe result and the retained-rail contract limits." }, { kind = "source", reference = "scripts/extract-gta4l-firmware.py", result = "Host-only extractor and --validate gate used for the booted-image provenance. The gate now rejects a declared kernel overrun, an invalid appended DTB header/size/bounds, a malformed trailing outer FFS entry, and non-erased trailing FV bytes, and it validates the whole outer stream before accepting the inner FV." }, { kind = "source", reference = "scripts/test-extract-gta4l-firmware.py", result = "Self-test for the extractor gate: pins the committed 90-module inventory, checks the three driver hashes, and rejects kernel overruns, invalid DTBs, malformed trailing outer FFS entries, non-erased tails, malformed sections and corrupt gzip end to end." }, { kind = "source", reference = "docs/power-path-decision.md", result = "Inventories the missing board-level electrical contract and recommends the retained-rail RPM-owned path over AP-side SPMI, without authorizing a live test." }, { kind = "source", reference = "docs/pm6125-usid-research.md", result = "Bounds the L11/L24 SPMI USID to {0,1} from pinned DT evidence and records that no pinned source selects one, so the RPM path is not exercised by the USID question." }, { kind = "source", reference = "docs/power-retention-evidence.md", result = "Records transition-by-transition RPM retention evidence: no AP vote for L11/L24, VDDCX/interconnect votes differ, the UEFI exit path is not passive, and retention across handoff, suspend, shutdown and reboot remains unestablished." }, { kind = "source", reference = "docs/sdhc-dependency-trace.md", result = "Records the sdhc_1 dependencies beyond L11/L24 (VDDCX corner, interconnect, GCC branches/reset, TLMM pads, SMMU stream 0xc0, IRQs) and which are present at handoff versus absent in XNU." }, { kind = "source", reference = "docs/sdhc-electrical-contract.md", result = "Records the Step 4 board-level electrical-contract assessment for the bus-power-only candidate: nine blocking safety-critical areas (E1–E9) and the evidence-acquisition requirements." }, { kind = "source", reference = "scripts/oracle-gta4l-sdhci-host-init.py", result = "Separate-implementation host oracle (same author) for the controller-local access policy; derives read/write rules from the header and write contract, validates 33 traces, checks prerequisite values, interrupt-suppression confirmation on both initial-value paths, universal stage-local poll bounds, reset-clear ordering, the reset-to-clock observation window, the stable clock poll completion and immediate final confirmation before downstream accesses, the eleven required final stage-4 observations, and post-reset state, rejects ten source mutations plus forty-one synthetic trace controls, and accepts the valid initially-zero interrupt baseline." }, { kind = "source", reference = "docs/sdhc-decision-memo.md", result = "Records the dated Step 6 NO-GO decision, the E1-E9/S1-S4 blocker dispositions and the separated baseline-measurement, controlled-activation and capability-approval gates for sdhc-bus-power-activation." }]

[[area]]
id = "packaging"
status = "planned"
components = []
paths = ["scripts/*payload*", "scripts/*image*", "scripts/*flash*", "scripts/package-*", "scripts/*boot-image*", "patches/**", "package/Kit.toml"]
inputs = ["Format 2 kernel step, archive builders, prelink, payload and boot image; 192 MiB payload size; iPad7,1 17.7.11 21H461 kernelcache."]
configuration = ["board.toml payload size_mib=192, loader=firmware, panic_screen=true, dram_size=0xC0000000; CONFIG_XNU_BUILD_ARCHIVES=y; output out/gta4l/ipados-17.7.11-21H461/gta4l."]
procedure = ["./unixnu build kernel -D ../UniXNU-gta4l; ./unixnu build package; ./unixnu build firmware; ./unixnu build payload; ./unixnu bootimg.", "For a raw RAM-root diagnostic payload, use scripts/build-gta4l-diagnostic-payload.py --diagnostic host-init with the data ramdisk, owner trust cache and unique chip ID. It copies the device tree, sets payload size and packed_data_ramdisk=false, runs the payload step, and checks the ADT contract without modifying the tracked board.toml.", "For a diagnostic image, use scripts/package-gta4l-diagnostic.py with the pinned v5 baseline and the payload; it preserves the header, firmware, boot DTB and boot kernel section, recomputes the boot-image ID, requires the payload/ADT contract, and runs scripts/check-gta4l-boot-image.py. Run scripts/test-gta4l-boot-image.py, scripts/test-gta4l-diagnostic-package.py and scripts/test-gta4l-sdhci-host-init-sim.py before flashing."]
findings = ["The PMGR-linked kernel/prelink pass: kernel.macho is a 49 MiB Mach-O arm64 image with SHA-256 dc8184da757b5323d2f4fb6c7ac1d588790b3d44d583c6d6fd24897cdbbcfe60; link.filelist has 1006 entries and none are missing. The earlier no-bridge hash was ef85af5417ace24e7b96f6c5a3224d2e7c40a163c1532bf2586f23fb5dd5f8bd.", "The full ordered archive plan is required: replacing it with only build-platform-power.py dropped the NativeAES bindings and failed the final link. board.toml now keeps the architecture list and appends the PMGR builder.", "The fresh tree first stopped in prepare-xnu-source.py while fetching omitted DriverKit headers; the retry-safe fetch restored 26 headers. The earlier Format 1 corecrypto failure was stale state, not a missing bootstrap object set.", "The corrected v2 audit image preserved the v5 boot header, firmware, boot DTB and boot kernel section exactly but was produced by temporary board.toml substitution. scripts/build-gta4l-diagnostic-payload.py now replaces that path for raw payloads by copying the device tree and forcing the explicit size and packed-data flags; scripts/package-gta4l-diagnostic.py takes the pinned baseline and a named payload as explicit inputs.", "scripts/package-gta4l-diagnostic.py now packages from the pinned v5 baseline and a named payload without modifying board.toml. It preserves the header page, firmware, boot kernel section and boot DTB, replaces only the ramdisk, recomputes the Android boot-image SHA-1 ID, and runs the component gate. Reproducing v2 from the v5 baseline and audit payload is byte-identical: a34519c66820eb5f1f4c4790be5e10233ffd4c8a4ece2df4768e7dca151c8546.", "scripts/check-gta4l-boot-image.py now checks the header page excluding the deterministic ID, the recomputed ID, zero kernel padding, absence of trailing data, the appended FDT total size, the Qualcomm ID properties and an optional expected payload hash. scripts/test-gta4l-boot-image.py covers exact pass, payload-only replacement, minimal-DTB substitution, a different valid DTB, a changed header field, a wrong ID, nonzero padding, trailing data, a short ramdisk, a wrong expected payload and a malformed image.", "An independent ABL/LinuxLoader-oriented check with bootimg_tool.py, provided by dmaccess, confirmed the v2 header, appended FDT and Qualcomm ID properties and rejected the v1 DTB. The tool is recorded as external evidence, not vendored; its outer FV/LZMA checks also fail on the known-good v5 image and are not used as a gate.", "scripts/check-gta4l-payload.py now checks the ADT memory-map placeholder against the actual scratch-data.img layout and checks unixnu.toml diagnostic arguments. Its self-test rejects the failed packed/raw mismatch and passes corrected v2. The failed host-init payload was packaged as PackedRAMDisk while the raw N4KROOT fixture reports RamdiskPacked=FALSE; DarwinBoot returned EFI_COMPROMISED_DATA at the UniXNU picker. Corrected v2 reserves RAMDisk and passes both the payload checker and the 18-check boot-image gate.", "scripts/build-gta4l-diagnostic-payload.py makes the former temporary diagnostic board explicit and reproducible: it copies the device tree, forces payload.size_mib=80 and packed_data_ramdisk=false, runs the normal payload step, copies the result, and requires the payload contract before writing a manifest. The tracked board.toml remains at 192 MiB packed.", "scripts/package-gta4l-diagnostic.py now runs scripts/check-gta4l-payload.py before publishing and records the contract result in the manifest. scripts/test-gta4l-diagnostic-package.py rejects a wrong expected diagnostic and the retained packed/raw failed payload; the valid audit payload still reproduces the v2 image byte-for-byte.", "scripts/test-gta4l-sdhci-host-init-sim.py compiles the production host-init source against a fake MMIO window and minimal kernel-header stubs, replaces only the six MMIO helpers with logging hooks, and records every read and write. It exercises conflicting arguments, an absent boot argument, a failed mapping, bus power already on, reset timeout, unstable clock, a pending vendor power request and a device-side vendor change; it asserts the exact write sequence, rejects any access outside the allowlist, and rejects an injected same-value POWER_CONTROL write that leaves final memory unchanged."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["The PMGR kernel host build/prelink and one QEMU checkpoint run pass. Payload and boot images have been built from this kernel, and the RAM-root report fixture booted on the tablet; it is not an authenticated-root result."]
next_action = ["Use the explicit diagnostic payload builder and the mandatory payload/ADT contract for raw RAM-root images; keep the pinned v5 baseline and the byte-identical v2 reproduction. The next packaging change is required only for a new documented baseline or payload format."]
evidence = [{ kind = "source", reference = "docs/build-revisions.md", result = "Records the RAM-root report image sha256 45ecc93049757e97a8d71edb776f67e69df5c9c58be13543295c154637273e24 and the fs/timer image sha256 c12e601eceb8e5b5b9cf7a028c0f404653b67dc5ff5577813293673d2dea2b3a (flashed; the fs/timer fixture then passed on the tablet with RAMROOT-FST PASS: pid=1 page=4096 fs=read+seek+eof timer=poll), with their gitignored artifact directories." }]

[[area]]
id = "diagnostics"
status = "planned"
components = []
paths = ["scripts/check-*", "scripts/probe-*", "scripts/audit-*", "scripts/read-*", "scripts/prepare-*", "scripts/data/**", "package/tests/**", "package/*Tests*", "package/*Diagnostic*", "package/*Probe*", "package/Boot*", "package/linux-log/**", "unixnu.lock"]
inputs = ["Build logs for the fresh Format 2 tree; the shared prepare-xnu-source.py fetch path; the TB128FU reference revisions."]
configuration = ["UNIXNU_XNU_TAG=xnu-10063.141.1 and the pinned source revision; GITHUB_TOKEN can be supplied to prepare-xnu-source.py but is not required."]
procedure = ["Run the kernel build with a log; on a fetch failure, preserve the log and retry with the retry-safe prepare-xnu-source.py; compare failures across clean output trees."]
findings = ["prepare-xnu-source.py used four threads with a 30 s TLS timeout and no retry. A GitHub raw fetch timed out during the first Format 2 kernel build, before any XNU compilation. The shared script now retries transient failures with a 60 s timeout and exponential backoff; scripts/test_prepare_xnu_source.py covers the retry and non-retry paths.", "The clean build completed with exit 0. The PMGR kernel.macho hash dc8184da757b5323d2f4fb6c7ac1d588790b3d44d583c6d6fd24897cdbbcfe60, 1006/1006 link objects and XNU_NATIVE_PAN=0 records are in docs/build-revisions.md.", "QEMU TCG reached _bsd_init, _sheng_pmgr_run and _IOKitBSDInit with sheng-pmgr=2 and no AMFI bypass, then timed out at _ml_get_timebase before _vfs_mountroot; the PMGR archive audit and build report are retained."]
completion = ["Each claimed milestone has a reproducible command, a matching source/image revision and an accessible result."]
limits = ["The retry test is a host unit test; the kernel/QEMU result is host-only. The QEMU serial layer has no Apple-compatible UART. The tablet result is a panic-screen report, not a serial log."]
next_action = ["Preserve the QEMU evidence and the tablet panic-screen result; qualify the fs/timer diagnostic separately."]
evidence = []
