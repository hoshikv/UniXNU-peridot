configuration = ["Kernel arguments mali=8 and mali-metal=1; evb10-gpu-addon=1 makes the payload tool carry the Metal plug-in.", "package/Mali is a submodule; scripts/build-mali-firmware.py generates the firmware include."]
procedure = ["Provide the firmware, build the kernel, then build the user-space stack from MaliMetal and the add-on it describes."]
findings = ["The stack composites the iPadOS lock screen on the Mali: backboardd, AGXAccelerator, NativeMaliMetal, metal2vulkan, PanVK and the Mali driver.", "PanVK counts a colour attachment with write mask 0 as written; a Mesa patch in MaliMetal fixes the black rectangle behind the lock screen clock.", "GPU time per frame is about 100 ms while scrolling (8 to 10 frames per second); the clock is fixed at 594 MHz."]
