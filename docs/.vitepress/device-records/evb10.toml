[[area]]
id = "packaging"
status = "implemented"
components = ["XnuPrelink", "DarwinBoot"]
paths = ["patches/xnu/**", "patches/tools/**", "package/**", "feeds.toml"]
inputs = ["XNU of the OS profile, ARM64, SoC and device patch series, generated Apple device tree, payload volume of 96 MiB, owner trust-cache digests."]
configuration = ["payload.* in board.toml and the [adt] tables; the device tree is generated from dts/evb10.dts.", "payload.kernel_args lists the boot arguments grouped by purpose."]
procedure = ["Run scripts/build-evb10-kernel.sh, then ./unixnu build payload with --unique-chip-id."]
findings = ["A rebuild from the six pushed repositories in an empty directory (docs/reproduce.md) reaches launchd with about 110 processes and Mali-composited frames; the feeds.toml pin of the SoC repository has to include the dts change that stops exporting interrupts on the eMMC and UART nodes, because an exported interrupts property without AAPL,phandle makes IOKit start-up take a data abort. The second trust_cache_sha256 entry changes with every rebuild because the user-space binaries are not bit-for-bit reproducible.", "The device series must not touch the context of the hunks of earlier series: the userland-mounts patch is generated by patches/tools/make-patches.py from a tree that has the earlier series applied.", "The Mali driver carries weak fallbacks for the display driver's GPU hand-off, because the display-less pass links it too (kernel patches call its test hooks); the display archive's strong definitions replace them.", "Each defconfig name is its own output directory (out/evb10/<os>/evb10 and .../evb10_display), so the display scripts read the display-less kernel from the sibling directory.", "The payload rides in a boot image through U-Boot's fastboot, whose download buffer is 112 MiB; 96 MiB of payload fits, 128 MiB was refused."]
completion = ["The payload boots on the board to the lock screen."]
limits = ["The two-pass kernel build of this layout completed on Linux (evb10_defconfig, then evb10_display_defconfig; kernel.macho 51.7 MB, sha256 56cac3bc9d5384005ec2b2919d6ce37eb8e6a72832568b51c0f6eb784dadf210). A payload was not assembled from it and the image was last booted with the previous layout."]
next_action = ["Boot an image built from this layout."]

