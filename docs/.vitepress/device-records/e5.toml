configuration = ["make-e5-payload.py assembles the payload FAT; mk-boot-payload.py wraps BootShim plus SILICIUM_UEFI.fd plus payload into the 62,926,860-byte boot image flashed to boot_b at LBA 8.", "The trust cache must be rebuilt whenever any seed binary is rebuilt (ad-hoc cdhashes change every build).", "The ADT root volume UUID and board.toml root_match_volume_uuid must track the APFS seed container UUID."]
procedure = ["Build seed binaries with the iphoneos SDK, ad-hoc codesign, collect cdhashes with codesign -dvvv, build the trust cache, pack the seed, assemble the payload, wrap the boot image and flash."]
findings = ["Payload FAT layout and boot image size are stable across rounds; the packed ramdisk size varies with the seed contents and shifts the staging window without breaking boot.", "A stale trust cache produces an AMFI unsuitable-CT-policy panic for PID 1; rebuilding the cache fixed it (flash 7 to 8).", "Flashes #55-#57 preserve kernel/ADT/EFI/configuration file hashes while replacing the trust cache for the actual signed eMMC-root binaries. Root and boot payload are fully read back before reboot; the static-tool entry correction changes ls/cat signatures and requires rebuilding both numeric aliases and the cache. #58 preserves every file except the kernel and matches the earlier kernel-only repacker byte-for-byte. #59 replaces only the ADT memory property, validated over the entire sidecar. Original-system input assembly and independent full-image/window verification are implemented in e5-xnu/tools/e5-system-root.py."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["The boot image is built on the host and flashed from Android; no on-device packaging yet."]
next_action = ["Automate the seed-to-payload chain into one script with a single UUID hand-off to reduce manual ADT patching."]

