[[area]]
id = "storage"
status = "implemented"
components = ["RamBlock"]
paths = ["scripts/emmc/**", "scripts/*ufs*", "tools/userspace/**", "docs/emmc-seed.md", "docs/system-volume-audit.md", "docs/logs/emmc-*.json", "docs/logs/emmc-*.log", "docs/logs/system-*.json", "docs/logs/uefi-report-161217.txt", "docs/logs/uefi-report-162200.txt", "docs/logs/uefi-report-163029.txt", "docs/logs/uefi-report-170641.txt", "docs/logs/uefi-report-172018.txt"]
inputs = ["Unisoc sprd,sdhci-r11 eMMC host at physical 0x22200000 (warm-inherited from LK: card selected in TRAN state, RCA 1), eMMC 61079552 sectors (29.125 GiB) with a 70-entry GPT, cache partition at LBA 0xd0a800 size 0x20000 sectors (64 MiB; corrected from the earlier 1 GiB claim), full disk mmcblk0."]
configuration = ["NativeEmmc (scripts/emmc/NativeEmmc.cpp) is compiled into the kernel by e5_emmc_build.py against the storage ABI derived from the pinned kernelcache.", "v2-v4 probes cover card identification, EXT_CSD, SDMA/ADMA MBR/GPT reads and boot_b/misc readback. v5 publishes the whole disk and IOGUIDPartitionScheme enumerates 70 partitions.", "v7 published a cache window at LBA 0xd0a800 with an incorrect 0x200000-sector length; v8 corrects it to the actual GPT/sysfs length of 0x20000 sectors (64 MiB), bounded by physical card capacity. The 8 MiB test image inside that partition contains its own GPT and an APFS volume E5EMMC; the physical eMMC GPT is unchanged.", "board.toml and the ADT match volume UUID 238A9EDD-6788-4B2E-BA4E-C1F70AE25B64. The current flash #59 baseline uses kernel 262/v8, a 512 MiB memory request, v9 PID1, aligned ls/cat entries and their matching trust cache; #58 retains the same storage fixes with a 256 MiB handoff."]
procedure = ["Clone the existing test image, preserve its volume UUID, create /dev and install the signed v9 PID1, ls/cat/clock and numeric aliases. Generate the trust cache from the actual installed binaries; see docs/emmc-seed.md.", "Back up and compare the previous 8 MiB cache test image before replacing only that existing test region from Android; verify the entire replacement by readback SHA256.", "Keep kernel/ADT/EFI/configuration fixed, rebuild FAT and rerun mk-boot-payload.py, flash through e5-uefi-cycle.sh and verify the full boot payload by readback before collect.", "Require the expected eMMC window, E5EMMC UUID/mount, INIT-START-v9, console fd0, TIOCGETA/ICANON, raw command exit statuses and SH READY/READ-BLOCK in the same report."]
findings = ["Physical GPT edits were restored across reboot in earlier tests; the boot-chain mechanism is not isolated. Partition-content writes survive. Current tests leave the physical GPT untouched.", "The v6 second-device/bare-container attempts did not produce a root mount, including the publisher-thread variant. v7 publishes the GPT-wrapped image through the original matched service and mounts it; the separate effects of GPT wrapping and publication were not isolated.", "IOKit reads through doAsyncReadWrite are verified for GPT, APFS metadata and seed executables. This proves the tested read path, not every error/recovery case.", "Flash #54 mounts E5EMMC with old v8; #55 adds v9, real console fd0, ICANON and four standard commands exiting 0. An extra long-argument cat SIGBUS is reproduced before its first trace in #56. #57 fixes the shared static-tool C stack alignment: all five commands exit 0 and the marker file is read. Its original argument pointer is 0x16fdffde8 (8 modulo 16), preserved while the working SP is aligned. SH READY/READ-BLOCK follow with no devfs, AMFI or child exception failure.", "The #55 through #59 seed-root images match full post-boot readback. #58 changes only the kernel and validates error-first reads, truthful write protection and the measured 64 MiB cache limit. #59 changes only the ADT memory request and passes the same five-command root workload."]
completion = ["Host: SDHCI register, clock, card mode and DMA facts match the board inventory.", "Reads: eMMC capacity, GPT and known blocks are correct; all exported windows stay within their containing partition.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["XNU eMMC writes are unsupported. This is a custom minimal APFS seed, not the original OS/SystemOS or a writable Data volume.", "v8 passes thirteen host completion/error and six window-boundary cases; #58 mounts the same root and runs all five commands with the corrected 64 MiB read-only window. Hardware CRC/timeout injection and failed-request recovery remain untested.", "Five batch commands and tty setup passed in #57/#58; physical keypad and serial command entry remain separate acceptance items."]
next_action = ["Use the #58/#59 read-only seed baselines to add original-system window publication. First validate native SD host reads against Android reference blocks, then design bounded image-file extents on the existing ext4 SD filesystem to preserve Android/adb recovery; original userland and persistent Data need their own acceptance."]

